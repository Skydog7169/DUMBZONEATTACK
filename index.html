<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🐈</text></svg>">
<title>DUMB ZONE: REVENGE OF THE CAT MAN</title>
<style>
  :root{
    --ink:#12081f; --neon:#ffd23f; --hot:#ff4f79; --cool:#39d5ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--ink);overflow:hidden;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;}
  #wrap{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0618;}
  /* CRT scanlines */
  #crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);mix-blend-mode:multiply;}
  #vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.75);}
  /* touch controls */
  .tc{position:absolute;bottom:4%;display:none;gap:8px;z-index:5;user-select:none;-webkit-user-select:none;}
  .touch .tc{display:flex;}
  #dpad{left:3%;flex-direction:column;align-items:center;}
  #dpad .row{display:flex;gap:8px;}
  #btns{right:3%;align-items:flex-end;gap:10px;}
  .tb{width:54px;height:54px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:bold;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  .tb:active,.tb.on{background:rgba(255,210,63,.55);}
  #btnA{width:68px;height:68px;border-radius:50%;background:rgba(255,79,121,.35);}
  #btnB{width:60px;height:60px;border-radius:50%;background:rgba(255,210,63,.30);}
  #btnS{width:52px;height:52px;border-radius:50%;background:rgba(57,213,255,.30);}
  #btnPause{position:absolute;top:3%;right:3%;width:44px;height:36px;border-radius:8px;display:none;z-index:5;
    border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-size:14px;
    align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;}
  .touch #btnPause{display:flex;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="crt"></div><div id="vig"></div>
  <div class="tc" id="dpad">
    <div class="row"><div class="tb" data-k="up">▲</div></div>
    <div class="row"><div class="tb" data-k="left">◀</div><div class="tb" data-k="down">▼</div><div class="tb" data-k="right">▶</div></div>
  </div>
  <div class="tc" id="btns">
    <div class="tb" id="btnS" data-k="special">S</div>
    <div class="tb" id="btnB" data-k="strong">B</div>
    <div class="tb" id="btnA" data-k="attack">A</div>
  </div>
  <div class="tb" id="btnPause" data-k="pause">II</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
